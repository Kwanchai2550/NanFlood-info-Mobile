<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nan Flood Dashboard</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: system-ui;
}

/* ===== TOP BAR ===== */
.topbar {
    height: 50px;
    background: #2c3e50;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    width: 100%;
    z-index: 1000;
}

/* ===== CONTENT ===== */
#content {
    position: absolute;
    top: 50px;
    bottom: 60px;
    width: 100%;
}

/* ===== PAGE ===== */
.page {
    display: none;
    height: 100%;
}

.page.active {
    display: block;
}

/* ===== MAP ===== */
.map {
    width: 100%;
    height: 100%;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #34495e;
    display: flex;
}

.bottom-nav button {
    flex: 1;
    color: white;
    background: none;
    border: none;
    font-size: 1.2rem;
}

/* ===== UI ===== */
.panel {
    padding: 10px;
}

input {
    width: 100%;
    margin-top: 5px;
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    🌊 Nan Flood Dashboard
</div>

<!-- CONTENT -->
<div id="content">

    <div class="page active" id="page1"></div>
    <div class="page" id="page2"></div>
    <div class="page" id="page3"></div>
    <div class="page" id="page4"></div>
    <div class="page" id="page5"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <button onclick="showPage(1)">🎥</button>
    <button onclick="showPage(2)">📍</button>
    <button onclick="showPage(3)">📊</button>
    <button onclick="showPage(4)">🌊</button>
    <button onclick="showPage(5)">🏠</button>
</div>

<script>

/* ===== NAVIGATION ===== */
function showPage(n) {
    document.querySelectorAll('.page')
        .forEach(p => p.classList.remove('active'));

    document.getElementById('page' + n)
        .classList.add('active');

    setTimeout(() => {
        if (map2) map2.invalidateSize();
        if (map4) map4.invalidateSize();
        if (map5) map5.invalidateSize();
    }, 200);
}

/* ===== PAGE 1: VIDEO ===== */
document.getElementById('page1').innerHTML = `
<video controls style="width:100%;height:100%">
    <source src="Sim_Flood_Nan_All.mp4">
</video>
`;

/* ===== PAGE 2: OBS MAP ===== */
document.getElementById('page2').innerHTML = `
<div id="map2" class="map"></div>
`;

var map2 = L.map('map2').setView([18.783,100.775],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map2);

/* ===== PAGE 3: SCATTER ===== */
document.getElementById('page3').innerHTML = `
<canvas id="scatterChart"></canvas>
`;

new Chart(document.getElementById('scatterChart'), {
    type: 'scatter',
    data: {
        datasets: [{
            label: 'Obs vs Sim',
            data: [
                {x:0.2,y:0.3},
                {x:0.5,y:0.45},
                {x:1.0,y:0.9}
            ]
        }]
    },
    options: {
        responsive:true,
        maintainAspectRatio:false
    }
});

/* ===== PAGE 4: FLOOD MAP ===== */
document.getElementById('page4').innerHTML = `
<div id="map4" class="map"></div>
`;

var map4 = L.map('map4').setView([18.783,100.775],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map4);

/* ===== PAGE 5: DAMAGE ===== */
document.getElementById('page5').innerHTML = `
<div class="panel">

💰 ราคา (บาท/ตร.ม.)
<input id="cost" value="15000">

<div id="summary"></div>

<canvas id="chart"></canvas>

</div>

<div id="map5" class="map"></div>
`;

var map5 = L.map('map5').setView([18.783,100.775],14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map5);

</script>

</body>
</html>
